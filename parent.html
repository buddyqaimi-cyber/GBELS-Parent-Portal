<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#17603f">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --ink:#10231b; --muted:#3c5348; --paper:#eef3f0; --card:#ffffff; --line:#cfdcd5;
  --green:#17603f; --green-soft:#dcefe5; --amber:#8a4b00; --amber-soft:#fcefd2; --red:#a4262c; --red-soft:#fbe3e3;
  --hol-bg:#dbe8fb; --hol-fg:#1c4a8a; --abs-bg:#a4262c; --abs-fg:#fff;
  --radius:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --ink:#e8f3ed; --muted:#a9c2b5; --paper:#0d1a14; --card:#14251c; --line:#27402f; --green:#4fc08a; --green-soft:#17382a; --amber:#f0b45a; --amber-soft:#3a2a0e; --red:#f19a9d; --red-soft:#3a1618; --hol-bg:#14283f; --hol-fg:#9cc4f2; --abs-bg:#c0392b; --abs-fg:#fff; color-scheme:dark; }
}
:root[data-theme="dark"]{ --ink:#e8f3ed; --muted:#a9c2b5; --paper:#0d1a14; --card:#14251c; --line:#27402f; --green:#4fc08a; --green-soft:#17382a; --amber:#f0b45a; --amber-soft:#3a2a0e; --red:#f19a9d; --red-soft:#3a1618; --hol-bg:#14283f; --hol-fg:#9cc4f2; --abs-bg:#c0392b; --abs-fg:#fff; color-scheme:dark; }
:root[data-theme="light"]{ color-scheme:light; }
.langs #themeBtn{margin-inline-start:auto;padding:4px 12px;font-size:1.05rem;line-height:1}
.bld{margin-top:6px;font-size:.75rem;opacity:.85;direction:ltr;text-align:start}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.rtl{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic","Jameel Noori Nastaleeq","Segoe UI",Tahoma,serif;font-size:18px;line-height:1.9}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
header{background:var(--green);color:#fff;padding:14px 16px 16px}
header .in{max-width:520px;margin:0 auto}
.hd{display:block}
.hd .tx{min-width:0}
header h1{margin:0;font-size:1.1rem;line-height:1.4;font-weight:700;text-wrap:balance}
body:not(.rtl) header h1{text-wrap:wrap}
header p{margin:2px 0 0;font-size:.9rem;opacity:.9}
.langs{display:flex;gap:6px;margin-top:10px}
.langs button{border:1.5px solid rgba(255,255,255,.65);background:transparent;color:#fff;border-radius:999px;padding:4px 14px;cursor:pointer;min-height:36px}
.langs button[aria-pressed="true"]{background:#fff;color:#17603f;border-color:#fff;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:1.1rem;letter-spacing:.06em;direction:ltr;text-align:start}
.btn{display:block;width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:var(--green);color:#fff;font-weight:700;cursor:pointer;min-height:48px}
body:not(.rtl) .btn{font-size:1.05rem}
.btn[disabled]{opacity:.6}
.btn.ghost{background:transparent;color:var(--green);border:1.5px solid var(--green);margin-top:12px}
.err{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--red-soft);color:var(--red);font-weight:600}
.priv{margin-top:14px;font-size:.85rem;color:var(--muted)}
.kid h2{margin:0;font-size:1.5rem;line-height:1.3}
.kid p{margin:4px 0 0;color:var(--muted)}
.tmtop{background:var(--amber-soft);border-color:#e7c98a}.tmh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;color:var(--amber)}.tmpill{background:var(--card);border-radius:999px;padding:0 10px;font-size:.85rem}.tmbig{font-size:1.25rem;font-weight:800;margin:4px 0}.tmsm{color:var(--muted);font-size:.9rem}.tmrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}.tmrow:first-of-type{border-top:0}.tmnow{outline:2px solid var(--green);outline-offset:4px;border-radius:8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:16px;background:var(--line);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;padding:9px 4px;border-radius:9px;cursor:pointer;font-weight:600;min-height:44px;color:var(--ink)}
.tabs button:last-child:nth-child(3n+1){grid-column:1/-1}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.big strong{font-size:3rem;line-height:1;font-weight:800;color:var(--green)}
.big span{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:5px 12px;border-radius:999px;font-weight:600;font-size:.9rem;border:1.5px solid var(--line)}
.chip.p{background:var(--green-soft);color:var(--green);border-color:transparent}
.chip.a{background:var(--red-soft);color:var(--red);border-color:transparent}
.chip.l{background:var(--amber-soft);color:var(--amber);border-color:transparent}
h3{margin:20px 0 8px;font-size:1rem}
.mrow{margin-top:10px}
.mrow .top{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}
.cnt{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;margin-top:4px;font-weight:600}
.cnt .p{color:var(--green)} .cnt .a{color:var(--red)} .cnt .l{color:var(--amber)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:4px}
.bar i{display:block;height:100%}
.bar .p{background:var(--green)} .bar .a{background:var(--red)} .bar .l{background:var(--amber)}
.banner{padding:12px 14px;border-radius:10px;font-weight:700}
.banner.ok{background:var(--green-soft);color:var(--green)}
.banner.due{background:var(--red-soft);color:var(--red)}
.banner.none{background:var(--line);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.cell{border:1.5px solid var(--line);border-radius:8px;text-align:center;padding:6px 2px;font-size:.8rem;line-height:1.3}
.cell b{display:block;font-size:1rem}
.cell.paid{background:var(--green-soft);border-color:transparent;color:var(--green)}
.cell.due{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.cell.later{color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:start}
td.n,th.n{text-align:end;direction:ltr;white-space:nowrap}
tfoot td{font-weight:700;border-bottom:0}
.badge{display:inline-block;padding:3px 14px;border-radius:999px;font-weight:700}
.badge.pass{background:var(--green-soft);color:var(--green)}
.badge.fail{background:var(--red-soft);color:var(--red)}
.note{padding:12px 0;border-bottom:1px solid var(--line)}
.note:last-child{border-bottom:0}
.note small{color:var(--muted);display:block}
.note h4{margin:2px 0 4px;font-size:1.05rem}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{color:var(--muted);padding:6px 0}
.foot{margin-top:16px;font-size:.85rem;color:var(--muted);text-align:center}
.foot a{color:var(--green);font-weight:700;white-space:nowrap}
#upd{font-weight:700;color:var(--ink)}
.ct-l{color:var(--green);font-weight:800}
.ct-h{color:var(--amber);font-weight:800}
.cpv{position:relative;overflow:hidden;direction:ltr;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px}
.cpv iframe{display:block;width:794px;height:1123px;border:0;background:#fff;transform-origin:0 0}
.foot.rn{margin-top:8px;padding:10px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-weight:600;text-align:start}
button.chip{background:transparent;cursor:pointer;color:var(--ink);min-height:40px;padding:5px 14px}
button.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
tr.dim td{color:var(--muted);opacity:.75}
tr.next td{background:var(--green-soft)}
td small{color:var(--muted)}
.hint{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--amber-soft);color:var(--amber);font-weight:600}
.mnav{display:flex;gap:8px;align-items:center;margin-top:14px}
.mnav select{flex:1;min-width:0;min-height:44px;font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.mnav button{min-width:44px;min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mnav button[disabled]{opacity:.35;cursor:default}
body.rtl .mnav button svg{transform:scaleX(-1)}
.cg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;direction:ltr}
.cg .h{font-size:.68rem;text-align:center;color:var(--muted);padding:2px 0;overflow:hidden;white-space:nowrap;line-height:1.4}
.cg .d{aspect-ratio:1/1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.85rem;line-height:1.15;background:var(--line);color:var(--muted)}
.cg .d small{font-size:.72rem;font-weight:700;min-height:.8rem}
.cg .d.p,.lg i.p{background:var(--green-soft);color:var(--green)}
.cg .d.a{background:var(--abs-bg);color:var(--abs-fg);font-weight:800}
.cg .d.a small{font-weight:800}
.lg i.a{background:var(--abs-bg)}
.cg .d.l,.lg i.l{background:var(--amber-soft);color:var(--amber)}
.cg .d.h,.lg i.h{background:var(--hol-bg);color:var(--hol-fg)}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:.8rem;color:var(--muted)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:5px;vertical-align:-1px;background:var(--line)}
.pr-only{display:none}
@media print{
  :root{--ink:#10231b;--muted:#3c5348;--paper:#fff;--card:#fff;--line:#bbbbbb;--green:#17603f;--green-soft:#dcefe5;--amber:#8a4b00;--amber-soft:#fcefd2;--red:#a4262c;--red-soft:#fbe3e3;--hol-bg:#dbe8fb;--hol-fg:#1c4a8a}
  body{background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .langs,#login,#tabs,#exit,#inst,#instHint,#contact,#rnote,.noprint,.hint{display:none!important}
  header{background:#fff!important;color:#000!important;border-bottom:2px solid #17603f;padding:8px 0}
  header h1,header p{color:#000!important}
  .wrap{max-width:none;padding:0}
  .card{border:0;box-shadow:none;padding:6px 0;margin-top:6px}
  .pr-only{display:block!important}
  h3.ttl{text-align:center;font-weight:800;font-size:1.25rem;margin:10px 0 6px}
  tr,.note{break-inside:avoid}
}
[hidden]{display:none!important}
</style>

<body class="rtl">
<header>
  <div class="in">

</header>
<main class="wrap">

    <div class="tabs" role="tablist" id="tabs"></div>

    <div class="foot" id="contact"></div>
    <div class="foot" id="upd"></div>
    <div class="foot rn" id="rnote"></div>
    <div class="pr-only" id="pfoot"></div>
    <button class="btn ghost" id="exit" type="button"></button>
  </section>
  <button class="btn ghost" id="inst" type="button"></button>
  <p class="hint" id="instHint" hidden></p>
</main>

function unb64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function normGr(v){return String(v==null?'':v).trim().replace(/\s+/g,'').replace(/^0+(?=\d)/,'');}
async function lookupKey(gr,salt){
  var h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+'|'+gr));
  return Array.from(new Uint8Array(h)).slice(0,12).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
async function deriveKey(gr,pin,salt,iter){
  var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(gr+':'+pin),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
}
// Returns the student's record, or null when GR No. / PIN do not match any record
async function openRecord(data,grIn,pinIn){
  var gr=normGr(grIn),pin=String(pinIn||'').trim();
  var bucket=data.ent[await lookupKey(gr,data.salt)]||[];
  var key=await deriveKey(gr,pin,data.salt,data.it); // always derive, so a wrong GR No. takes as long as a wrong PIN
  for(var i=0;i<bucket.length;i++){
    var e=bucket[i];
    try{
      var pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.i)},key,unb64(e.c)));
      if(e.z){pt=new Uint8Array(await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());}
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(_){}
  }
  return null;
}

  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;});
  window.addEventListener('appinstalled',function(){$('inst').hidden=true;$('instHint').hidden=true;});
  if((window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone)$('inst').hidden=true;
  $('inst').addEventListener('click',async function(){
    if(deferred){deferred.prompt();try{await deferred.userChoice;}catch(e){}deferred=null;}
    else{$('instHint').hidden=false;}
  });
  $('tabs').addEventListener('click',function(ev){var b=ev.target.closest('button[data-k]');if(!b)return;TAB=b.dataset.k;show();});
  $('exit').addEventListener('click',function(){REC=null;ATTM='';$('view').hidden=true;$('login').hidden=false;$('gr').value='';$('pin').value='';window.scrollTo(0,0);});
  Array.prototype.forEach.call(document.querySelectorAll('.langs button[data-l]'),function(b){b.addEventListener('click',function(){setLang(b.dataset.l);});});
  (function(){var tb=$('themeBtn');if(!tb)return;var IC={light:'\u2600\uFE0F',dark:'\uD83C\uDF19'};var cur='';try{var v=localStorage.getItem('pp_theme');if(v==='light'||v==='dark')cur=v;}catch(e){}
    if(!cur){try{cur=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}catch(e){cur='light';}}
    function ap(save){document.documentElement.setAttribute('data-theme',cur);tb.textContent=IC[cur];tb.setAttribute('aria-label','Theme: '+cur+' (tap to switch)');if(save){try{localStorage.setItem('pp_theme',cur);}catch(e){}}}
    tb.addEventListener('click',function(){cur=cur==='dark'?'light':'dark';ap(true);});ap(false);})();
  setLang(L);
  window.addEventListener('resize',function(){fitName();fitCerts();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitName);
  try{var qg=new URLSearchParams(location.search).get('gr');if(qg){$('gr').value=String(qg).replace(/[^0-9]/g,'').slice(0,20);$('pin').focus();}}catch(e){}
  loadData().catch(function(){});
})();
